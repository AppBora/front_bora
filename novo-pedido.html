<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoraHapp - Novo Pedido</title><link rel="icon" href="assets/img/icone-bora.svg"><link rel="stylesheet" href="assets/css/styles.css?v=20260907b"><style>
  /* A folha global estica qualquer input dentro de .field (width:100%;padding:12px). Num campo de
     texto isso e certo; num checkbox faz a caixa empurrar o nome para o canto e quebrar a linha,
     que foi exatamente o que apareceu na tela. Aqui a lista de adicionais tem regra propria. */
  #complementos{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-top:8px}
  #complementos .cg + .cg{margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0}
  #complementos .cg-h{font-size:13px;font-weight:800;color:#111;margin:0 0 6px;text-transform:none}
  #complementos .cg-h span{font-weight:600;color:#94a3b8}
  #complementos .cg-ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 18px}
  #complementos label.cop{display:flex;align-items:center;gap:9px;margin:0;padding:7px 8px;border-radius:8px;
    cursor:pointer;font-size:14px;color:#111;text-transform:none;line-height:1.25}
  #complementos label.cop:hover{background:#eef2ff}
  #complementos input[type=checkbox],#complementos input[type=radio]{
    width:18px;height:18px;min-width:18px;flex:0 0 18px;padding:0;margin:0;border-radius:4px;accent-color:var(--primary)}
  #complementos .cop-n{flex:1}
  #complementos .cop-p{color:#166534;font-weight:700;white-space:nowrap}
</style>
</head><body>
<div class="layout">
  <aside class="side"><div class="brand"><div class="logo"></div><div><b data-store>BoraHapp</b><br><small>Delivery em tempo real</small></div></div>
    <nav class="nav"><a href="dashboard.html">Dashboard</a><a class="active" href="pedidos.html">Pedidos</a><a href="clientes.html">Clientes</a><a href="produtos.html">Produtos</a><a href="entregas.html">Entregas</a><a href="promocoes.html">Promoções</a><a href="relatorios.html">Relatórios</a><a href="configuracoes.html">Configurações</a><a class="" href="usuarios.html">Usuários</a><a href="planos.html">Planos</a></nav>
  </aside>
  <main class="main">
    <header class="top"><div class="title"><h1>Novo Pedido</h1><p data-store>Sorveteria da Rosa</p></div>
      <a class="btn" href="pedidos.html" style="background:#64748b">← Pedidos</a>
    </header>
    <div class="card">
      <form id="form" class="form">
        <div class="field"><label>Cliente</label>
          <select id="cliente"></select>
          <button type="button" class="btn ghost" id="btnNovoCliente" style="margin-top:6px;background:#e5e7eb;color:#111;padding:6px 10px;font-size:13px">+ Novo cliente</button>
          <div id="novoClienteBox" style="display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
            <input id="ncNome" placeholder="Nome*">
            <input id="ncTelefone" placeholder="WhatsApp">
            <input id="ncEndereco" placeholder="Endereço" style="grid-column:1/-1">
            <input id="ncBairro" placeholder="Bairro (define a taxa)" style="grid-column:1/-1">
          </div>
          <label id="cashbackBox" style="display:none;align-items:center;gap:8px;margin-top:8px;background:#ecfdf5;border-radius:10px;padding:9px;cursor:pointer;font-size:13px;font-weight:700;color:#166534">
            <input type="checkbox" id="usarCashback" style="width:16px;height:16px"> Usar cashback (<span id="cashbackVal"></span>)</label>
        </div>
        <div class="field"><label>Canal de venda</label><select id="origem"></select></div>

        <div class="field full"><label>Adicionar produto</label>
          <div class="itens-linha">
            <select id="produto" class="nome"></select>
            <input id="qtd" type="number" min="1" value="1" style="width:80px">
            <button type="button" class="btn" id="add">＋ Adicionar ao pedido</button>
          </div>
          <p id="msgItem" style="display:none;margin:8px 0 0;padding:9px 12px;border-radius:8px;background:#fef2f2;color:#b91c1c;font-size:14px;font-weight:600"></p>
          <div id="complementos" style="display:none"></div>
          <div id="resumoProduto" style="display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:#64748b">
            <img id="fotoProduto" alt="" style="display:none;width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid #e2e8f0">
            <span>Unitário com adicionais: <b id="precoProduto" style="color:#111;font-size:15px">R$ 0,00</b></span>
          </div>
        </div>

        <div class="field full"><label>Itens do pedido</label>
          <table class="table"><tbody id="itens"></tbody></table>
          <div style="max-width:320px;margin-left:auto;margin-top:10px;font-size:14px">
            <div style="display:flex;justify-content:space-between;padding:2px 0"><span>Subtotal</span><span id="linhaSub">R$ 0,00</span></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 0">
              <span>Taxa de entrega</span>
              <span style="display:flex;align-items:center;gap:6px">
                <input id="taxa" type="number" step="0.01" min="0" value="0" style="width:90px;text-align:right;padding:4px 6px"></span>
            </div>
            <div id="boxCashback" style="display:none;justify-content:space-between;padding:2px 0;color:#166534"><span>Cashback</span><span id="linhaCashback">- R$ 0,00</span></div>
            <div style="display:flex;justify-content:space-between;border-top:1px solid #e2e8f0;margin-top:6px;padding-top:6px;font-size:20px;font-weight:900">
              <span>Total</span><span id="total">R$ 0,00</span></div>
          </div>
        </div>

        <div class="field"><label>Forma de pagamento</label><select id="pagamento"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select></div>
        <div class="field full"><label>Observação</label><textarea id="obs"></textarea></div>
        <div class="field full"><button class="btn" type="submit" id="salvar">Salvar pedido</button> <span id="msg" style="color:var(--danger);margin-left:10px"></span></div>
      </form>
    </div>
  </main>
</div>
<script src="assets/js/api.js?v=20260828"></script>
<script src="assets/js/app.js?v=20260907e"></script>
<script src="assets/js/whitelabel.js?v=20260623"></script>
<script src="assets/js/novo-pedido.js?v=20260907d"></script>
</body></html>
