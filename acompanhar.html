<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar pedido</title><link rel="icon" href="assets/img/icone-bora.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:#f6f7fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.08);max-width:420px;width:100%;padding:28px;text-align:center}
  h1{font-size:20px;margin-bottom:2px}
  .cod{color:#64748b;font-size:14px;margin-bottom:22px}
  .passo{display:flex;gap:14px;text-align:left;position:relative;padding-bottom:26px}
  .passo:last-child{padding-bottom:0}
  .bola{width:34px;height:34px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;z-index:1}
  .passo::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:#e2e8f0}
  .passo:last-child::before{display:none}
  .passo.ok .bola{background:#dcfce7}
  .passo.atual .bola{background:var(--marca,#9333ea);color:#fff;animation:pulsa 1.6s infinite}
  .passo.ok::before{background:#86efac}
  .t{font-weight:700;font-size:15px}.s{color:#6b7280;font-size:13px}
  .passo.atual .t{color:var(--marca,#9333ea)}
  @keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(147,51,234,.35)}50%{box-shadow:0 0 0 10px rgba(147,51,234,0)}}
  .cancel{background:#fef2f2;color:#991b1b;border-radius:12px;padding:14px;font-weight:700;margin-top:6px}
  /* 1,48:1 sobre o cartao branco: praticamente invisivel, e e onde fica a UNICA assinatura do
     BoraHapp na tela que o consumidor final mais olha. O #6b7280 da 4,83:1. */
  .rodape{margin-top:22px;color:#6b7280;font-size:12px}
</style></head><body>
<div class="card">
  <h1 id="loja">Carregando…</h1>
  <div class="cod" id="cod"></div>
  <div id="timeline"></div>
  <div class="rodape" id="rodape">Atualiza sozinho</div>
</div>
<script>
(function(){
  const q = new URLSearchParams(location.search);
  const lojaId = q.get('loja'), pedidoId = q.get('pedido'), token = q.get('t') || '';
  // A tela que o cliente final fica olhando enquanto espera o pedido era roxa do Bora e assinada
  // "BoraHapp", em qualquer loja. Quem esta esperando o pedido e cliente da LOJA.
  (async function vestirMarca() {
    try {
      const m = await (await fetch(location.origin + '/public/loja/' + lojaId + '/marca')).json();
      if (m.corPrimaria) document.documentElement.style.setProperty('--marca', m.corPrimaria);
      // O h1 e preenchido pela resposta do proprio pedido (linha do 'd.loja'); nao mexemos nele
      // aqui para as duas partes nao brigarem pelo mesmo lugar.
      document.title = (m.nome ? m.nome + ' · ' : '') + 'Acompanhar pedido';
      if (m.logoUrl) { const ic = document.querySelector('link[rel="icon"]'); if (ic) ic.href = m.logoUrl; }
      const rod = document.getElementById('rodape');
      if (rod && m.mostrarMarcaBora !== false) rod.textContent = 'Atualiza sozinho · BoraHapp';
    } catch (e) { /* sem marca, segue com o padrao: nunca deixar a tela de pedido quebrar por isso */ }
  })();

  if (!lojaId || !pedidoId || !/^https?:/.test(location.protocol)) {
    document.getElementById('loja').textContent = 'Link incompleto';
    document.getElementById('timeline').innerHTML =
      '<div class="cancel" style="font-weight:400">Este link de acompanhamento não é válido. Use o link que você recebeu no WhatsApp ou na tela do pedido. 😉</div>';
    return;
  }
  const FASES = [
    { st:['RECEBIDO'],            ic:'📨', t:'Pedido recebido',    s:'Chegou na loja' },
    { st:['CONFIRMADO'],          ic:'✅', t:'Confirmado',         s:'A loja aceitou seu pedido' },
    { st:['EM_PREPARO'],          ic:'👨‍🍳', t:'Em preparo',         s:'Capricho em andamento' },
    { st:['PRONTO'],              ic:'📦', t:'Pronto',             s:'Embalado e esperando' },
    { st:['SAIU_PARA_ENTREGA'],   ic:'🛵', t:'Saiu para entrega',  s:'A caminho de você', soEntrega:true },
    { st:['ENTREGUE'],            ic:'🎉', t:'Entregue',           s:'Bom apetite!' }
  ];
  const ORDEM = ['RECEBIDO','CONFIRMADO','EM_PREPARO','PRONTO','SAIU_PARA_ENTREGA','ENTREGUE'];
  // A LINHA DO TEMPO DEPENDE DO TIPO DE ENTREGA.
  //
  // Ela era uma constante de seis fases, e a quinta e "Saiu para entrega -- a caminho de voce".
  // Quem escolheu RETIRADA lia isso e ficava esperando em casa um motoboy que nao existe; na
  // retirada o pedido vai de PRONTO direto para ENTREGUE, entao aquele passo nunca acende -- ele
  // so ficava la, cinza, contando uma historia errada.
  //
  // Quem diz se e retirada e o servidor (`retirada` no status). Enquanto a resposta nao trouxer o
  // campo -- link antigo, servidor de versao anterior --, `!d.retirada` e falso e a tela continua
  // como estava: mostrar um passo a mais e melhor que esconder um que vai acontecer.
  const fasesPara = (retirada) => FASES.filter(f => !f.soEntrega || !retirada);
  const rotuloFinal = (retirada) => (retirada
    ? { t:'Retirado', s:'Bom apetite!' }
    : { t:'Entregue', s:'Bom apetite!' });
  async function tick(){
    try{
      // O `t` e a assinatura do pedido, que vem no link. Sem ele o status responde 404: os ids de
      // pedido sao sequenciais, e sem assinatura qualquer um varria os pedidos de qualquer loja.
      const r = await fetch(location.origin + '/public/loja/' + lojaId + '/pedido/' + pedidoId
        + '/status?t=' + encodeURIComponent(token));
      if(!r.ok) throw new Error('Pedido não encontrado');
      const d = await r.json();
      document.getElementById('loja').textContent = d.loja || 'Seu pedido';
      document.title = (d.loja || 'Pedido') + ' · ' + d.codigo;
      document.getElementById('cod').textContent = 'Pedido ' + d.codigo + (d.pago ? ' · PIX pago ✔' : '');
      if(d.status === 'CANCELADO'){
        document.getElementById('timeline').innerHTML =
          '<div class="cancel">😔 Pedido cancelado' + (d.motivoCancelamento ? '<br><small style="font-weight:400">' + String(d.motivoCancelamento).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}) + '</small>' : '') + '</div>';
        return;
      }
      const fases = fasesPara(d.retirada);
      // A posicao atual sai da lista QUE ESTA NA TELA, nao da ORDEM fixa: na retirada a quinta fase
      // nao existe, e usar o indice da ORDEM pintaria a fase errada de concluida.
      const atual = fases.findIndex(f => f.st.indexOf(d.status) >= 0);
      document.getElementById('timeline').innerHTML = fases.map((f,i)=>{
        const ultima = i === fases.length - 1;
        const fim = d.status === 'ENTREGUE';
        const cls = (atual >= 0 && i < atual) ? 'ok' : (i === atual ? (fim ? 'ok' : 'atual') : '');
        const rot = ultima ? rotuloFinal(d.retirada) : f;
        return '<div class="passo '+cls+'"><div class="bola">'+((atual >= 0 && i < atual) || (fim && i === atual) ? '✓' : f.ic)+'</div>'+
               '<div><div class="t">'+rot.t+'</div><div class="s">'+rot.s+'</div></div></div>';
      }).join('');
      if(d.status === 'ENTREGUE') clearInterval(timer);
    }catch(e){
      // Falha de rede (sinal fraco, Wi-Fi caindo) nao encerra: tenta de novo no proximo ciclo.
      if(e.message !== 'Pedido não encontrado') return;
      document.getElementById('loja').textContent = 'Ops!';
      document.getElementById('timeline').innerHTML = '<div class="cancel">Pedido não encontrado.</div>';
      clearInterval(timer);
    }
  }
  const timer = setInterval(tick, 5000);
  tick();
})();
</script>
</body></html>
