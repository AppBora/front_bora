<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoraHapp - Desempenho</title><link rel="icon" href="assets/img/icone-bora.svg"><link rel="stylesheet" href="assets/css/styles.css?v=20260907b"></head><body>
<div class="layout">
  <aside class="side"><div class="brand"><div class="logo"></div><div><b data-store>BoraHapp</b><br><small>Delivery em tempo real</small></div></div>
    <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="pedidos.html">Pedidos</a><a href="clientes.html">Clientes</a><a href="produtos.html">Produtos</a><a href="entregas.html">Entregas</a><a href="promocoes.html">Promoções</a><a href="relatorios.html">Relatórios</a><a class="active" href="desempenho.html">Desempenho</a><a href="configuracoes.html">Configurações</a><a href="usuarios.html">Usuários</a><a href="planos.html">Planos</a></nav>
  </aside>
  <main class="main">
    <header class="top"><div class="title"><h1>Desempenho</h1><p id="sub">Do faturamento ao lucro, loja por loja</p></div>
      <a class="btn" href="#" onclick="Bora.logout();return false" style="background:#64748b">Sair</a></header>

    <section class="row">
      <div class="card">
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
          <div class="field"><label>De</label><input type="date" id="ini"></div>
          <div class="field"><label>Até</label><input type="date" id="fim"></div>
          <button class="btn" id="buscar">Atualizar</button>
          <button class="btn" id="mes" style="background:#64748b">Mês atual</button>
          <button class="btn" id="hoje" style="background:#64748b">Hoje</button>
        </div>
        <p id="aviso" style="display:none;margin:12px 0 0;padding:11px 14px;border-left:3px solid #b45309;background:#fdf0dc;border-radius:0 8px 8px 0;font-size:14px"></p>
      </div>
    </section>

    <section class="row" id="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px"></section>

    <section class="row">
      <div class="card"><h2>Por loja</h2>
        <div style="overflow-x:auto">
          <table class="table" style="min-width:900px">
            <thead><tr>
              <th>Loja</th><th style="text-align:right">Pedidos</th><th style="text-align:right">Faturamento</th>
              <th style="text-align:right">Ticket</th><th style="text-align:right">CMV</th><th style="text-align:right">Entrega</th>
              <th style="text-align:right">Cashback</th><th style="text-align:right">Imposto</th><th style="text-align:right">Custo fixo</th>
              <th style="text-align:right">Mensalidade</th><th style="text-align:right">Lucro</th><th style="text-align:right">Margem</th>
            </tr></thead>
            <tbody id="lista"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>
