<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoraHapp - Frente de Caixa</title><link rel="icon" href="assets/img/icone-bora.svg"><link rel="stylesheet" href="assets/css/styles.css?v=20260904"></head><body>
<div class="layout">
  <aside class="side"><div class="brand"><div class="logo"></div><div><b data-store>BoraHapp</b><br><small>Delivery em tempo real</small></div></div>
    <nav class="nav"></nav>
  </aside>
  <main class="main">
    <header class="top"><div class="title"><h1>Frente de Caixa</h1><p>Venda rápida no balcão — toque nos produtos e finalize</p></div>
      <div style="display:flex;gap:10px"><a class="btn" href="caixa.html" style="background:#059669">💰 Fechar caixa</a>
        <a class="btn" href="#" onclick="Bora.logout();return false" style="background:#64748b">Sair</a></div></header>

    <div class="pdv">
      <div>
        <div class="board-search" style="margin-bottom:12px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="busca" placeholder="Buscar produto…" autocomplete="off">
        </div>
        <div class="pdv-cats chips" id="cats"></div>
        <div class="pdv-grid" id="grid"></div>
      </div>

      <div class="cart">
        <h2>🛒 Comanda</h2>
        <div class="cart-items" id="items"><div class="cart-empty">Toque em um produto para começar</div></div>
        <div class="cart-foot">
          <div class="ln"><span>Itens</span><span id="qtdItens">0</span></div>
          <div class="tot"><span>Total</span><span id="total">R$ 0,00</span></div>
          <select id="cliente"><option value="">Cliente avulso (balcão)</option></select>
          <label id="cashbackBox" style="display:none;align-items:center;gap:8px;background:#ecfdf5;border-radius:10px;padding:10px;margin-bottom:12px;cursor:pointer;font-size:13px;font-weight:700;color:#166534">
            <input type="checkbox" id="usarCashback" style="width:18px;height:18px"> Usar cashback disponível: <span id="cashbackVal"></span>
          </label>
          <div class="pays" id="pays">
            <button class="pay-btn sel" data-p="Dinheiro">💵 Dinheiro</button>
            <button class="pay-btn" data-p="Pix">⚡ Pix</button>
            <button class="pay-btn" data-p="Cartão">💳 Cartão</button>
          </div>
          <button class="btn-finish" id="finish" disabled>Finalizar venda</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Escolha de complementos: no balcão precisa caber num toque, então é modal e não outra tela. -->
  <div id="modalComp" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;align-items:center;justify-content:center;padding:16px">
    <div style="background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:16px 18px;border-bottom:1px solid #e2e8f0">
        <b id="mcTitulo" style="font-size:17px"></b>
        <div style="font-size:13px;color:#64748b;margin-top:2px">Unitário: <b id="mcPreco" style="color:#111"></b></div>
      </div>
      <div id="mcCorpo" style="padding:12px 18px;overflow-y:auto"></div>
      <div style="padding:12px 18px;border-top:1px solid #e2e8f0;display:flex;gap:10px;align-items:center">
        <button class="btn" id="mcOk" style="flex:1">Adicionar</button>
        <button class="btn ghost" id="mcCancelar" style="background:#e5e7eb;color:#111">Cancelar</button>
        <span id="mcErro" style="color:var(--danger);font-size:13px"></span>
      </div>
    </div>
  </div>
  <style>
    .mc-grupo{margin:10px 0}
    .mc-gnome{font-size:13px;font-weight:800;margin-bottom:4px}
    .mc-gnome span{font-weight:600;color:#94a3b8}
    .mc-op{display:flex;align-items:center;gap:9px;padding:9px 6px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:15px}
    .mc-op input{width:19px;height:19px}
    .mc-op span{flex:1}
    .mc-op b{color:#166534}
  </style>

</div>
<script src="assets/js/api.js?v=20260828"></script><script src="assets/js/app.js?v=20260623"></script><script src="assets/js/whitelabel.js?v=20260623"></script><script src="assets/js/pdv.js?v=20260907"></script>
</body></html>
