<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoraHapp - Clientes</title><link rel="icon" href="assets/img/icone-bora.svg"><link rel="stylesheet" href="assets/css/styles.css?v=20261023"></head><body>
<div class="layout">
  <aside class="side"><div class="brand"><div class="logo"></div><div><b data-store>BoraHapp</b><br><small>Delivery em tempo real</small></div></div>
    <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="pedidos.html">Pedidos</a><a class="active" href="clientes.html">Clientes</a><a href="produtos.html">Produtos</a><a href="entregas.html">Entregas</a><a href="promocoes.html">Promoções</a><a href="relatorios.html">Relatórios</a><a href="configuracoes.html">Configurações</a><a class="" href="usuarios.html">Usuários</a><a href="planos.html">Planos</a></nav>
  </aside>
  <main class="main">
    <header class="top"><div class="title"><h1>Clientes</h1><p data-store>Sua loja</p></div>
      <a class="btn" href="#" onclick="Bora.logout();return false" style="background:#64748b">Sair</a></header>
    <section class="row">
      <div class="card"><h2>Novo cliente</h2>
        <form id="form" class="form">
          <div class="field full"><label>Nome</label><input id="nome" required></div>
          <div class="field"><label>Telefone</label><input id="telefone" placeholder="(00) 00000-0000"></div>
          <div class="field"><label>Bairro</label><input id="bairro"></div>
          <div class="field full"><label>Endereço</label><input id="endereco"></div>
          <div class="field full"><label>Referência</label><input id="referencia"></div>
          <!-- O id do cliente em edicao. Vazio = cadastro novo (item 7.12 da varredura: a tela so
               tinha criar e excluir, e corrigir um telefone errado obrigava a excluir -- levando o
               cashback e o historico junto). -->
          <input id="id" type="hidden">
          <div class="field full">
            <button class="btn" type="submit" id="salvar">Adicionar cliente</button>
            <button class="btn ghost" type="button" id="cancelar" hidden style="background:#e5e7eb;color:#111">Cancelar</button>
            <span id="msg" style="color:var(--danger);margin-left:10px"></span>
          </div>
        </form>
      </div>
      <div class="card"><h2>Clientes da loja</h2>
        <input id="busca" placeholder="Buscar por nome, telefone ou bairro"
               style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:10px">
        <table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>Bairro</th><th></th></tr></thead><tbody id="lista"></tbody></table>
      </div>
    </section>
  </main>
</div>
<script src="assets/js/api.js?v=20261024"></script><script src="assets/js/app.js?v=20261023d"></script><script src="assets/js/cores.js?v=20261009"></script><script src="assets/js/whitelabel.js?v=20261024"></script><script src="assets/js/clientes.js?v=20261023d"></script>
</body></html>
