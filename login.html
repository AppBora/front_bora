<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoraHapp — Entrar</title>
  <link rel="icon" href="assets/img/icone-bora.svg">
  <link rel="stylesheet" href="assets/css/styles.css?v=20261023">
  <style>
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-card{background:#fff;border-radius:16px;box-shadow:0 8px 30px #0002;padding:32px;width:100%;max-width:360px}
    .login-card h1{margin:0 0 4px;font-size:26px;color:var(--primary,#9333ea)}
    .login-card p{margin:0 0 20px;color:#64748b;font-size:14px}
    .login-card label{display:block;font-size:13px;color:#334155;margin:12px 0 4px}
    .login-card input{width:100%;padding:11px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box}
    .login-card button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--primary,#9333ea);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
    .login-err{margin-top:12px;color:#dc2626;font-size:13px;min-height:18px}
    .login-foot{margin-top:16px;font-size:12px;color:#94a3b8;text-align:center}
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="form">
      <img src="assets/img/logo-bora.svg" alt="Bora" style="height:46px;margin-bottom:10px">
      <p>Acompanhe pedidos, entregas e vendas em tempo real.</p>
      <label>E-mail</label>
      <input type="email" id="email" required autocomplete="username" placeholder="voce@loja.com">
      <label>Senha</label>
      <input type="password" id="senha" required autocomplete="current-password" placeholder="••••••">
      <button type="submit" id="btn">Entrar</button>
      <div class="login-err" id="err"></div>
      <div class="login-foot" style="margin-bottom:6px">
        <a href="#" id="trocar" style="color:var(--primary,#9333ea);font-weight:600;text-decoration:none">Trocar minha senha</a>
        <span style="color:#94a3b8"> · </span>
        <a href="#" id="esqueci" style="color:var(--primary,#9333ea);font-weight:600;text-decoration:none">Esqueci minha senha</a>
      </div>
      <div class="login-foot" style="margin-bottom:6px">Não tem conta? <a href="cadastro.html" style="color:var(--primary,#9333ea);font-weight:600;text-decoration:none">Criar grátis</a></div>
      <div class="login-foot">BoraHapp · SaaS para pequenos deliveries</div>
    </form>

    <!-- Troca da propria senha, para quem NAO tem a tela de Configuracoes (operador e gerente).
         Exige a senha antiga: sem isso, qualquer um que soubesse um e-mail trocaria a senha alheia. -->
    <form class="login-card" id="formTroca" hidden style="margin-top:14px">
      <h2 style="margin:0 0 4px;font-size:18px">Trocar minha senha</h2>
      <p style="margin:0 0 10px;color:#64748b;font-size:13px">
        Precisa saber a senha atual. Se não souber, use <b>Esqueci minha senha</b>.
      </p>
      <label>E-mail</label>
      <input type="email" id="tEmail" required autocomplete="username" placeholder="voce@loja.com">
      <label>Senha atual</label>
      <input type="password" id="tAtual" required autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
      <label>Nova senha <span style="font-weight:400;color:#64748b;font-size:12px">&middot; minimo 8 caracteres</span></label>
      <input type="password" id="tNova" required autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      <label>Repita a nova senha</label>
      <input type="password" id="tNova2" required autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      <button type="submit" id="tBtn">Trocar senha</button>
      <div class="login-err" id="tErr"></div>
      <div class="login-foot"><a href="#" id="tVoltar" style="color:var(--primary,#9333ea);font-weight:600;text-decoration:none">Voltar para o login</a></div>
    </form>
  </div>
  <script src="assets/js/api.js?v=20261028"></script>
  <script>
    if (Bora.token()) location.href = 'dashboard.html';
    // Nao existe envio de e-mail no sistema, entao "esqueci a senha" nao pode virar um link magico
    // por e-mail. O caminho que resolve hoje: o administrador da loja redefine em Usuarios, e quem
    // nao tem a quem recorrer fala com o suporte - ja com o e-mail preenchido na mensagem.
    document.getElementById('esqueci').addEventListener('click', async (ev) => {
      ev.preventDefault();
      const email = (document.getElementById('email').value || '').trim();
      const err = document.getElementById('err');
      if (!email) {
        err.style.color = ''; err.textContent = 'Escreva seu e-mail acima e clique de novo.';
        document.getElementById('email').focus();
        return;
      }
      // Registra o pedido para o ADMINISTRADOR DA LOJA ver na tela de Usuarios. E o canal que
      // funciona hoje: nao ha envio de e-mail no sistema, e nenhuma loja tem WhatsApp valido da Meta
      // (conferido em 18/10/2026 -- a credencial de uma venceu em julho, a da outra e texto de
      // exemplo). Quando houver, o mesmo registro dispara a mensagem sozinho.
      //
      // A resposta e sempre a mesma, exista o e-mail ou nao: senao esta tela viraria um jeito de
      // descobrir quem usa o BoraHapp digitando enderecos.
      try {
        await Bora.api('/auth/pedido-de-senha', { method: 'POST', body: JSON.stringify({ email }) });
      } catch (e) {
        // 429 do freio ou API fora do ar: o caminho do WhatsApp abaixo continua valendo.
      }
      err.style.color = '#166534';
      err.textContent = 'Avisamos o administrador da sua loja. Ele redefine sua senha em Usuários.';
      const texto = 'Oi! Esqueci a senha do BoraHapp. Meu e-mail de acesso é ' + email + '. Pode me ajudar a redefinir?';
      if (confirm('Quem redefine a senha é o administrador da sua loja — ele já foi avisado no painel.\n\nQuer abrir o WhatsApp para falar com o suporte do BoraHapp também?')) {
        window.open('https://wa.me/5515998602332?text=' + encodeURIComponent(texto), '_blank', 'noopener');
      }
    });

    // ---- Trocar a propria senha, sem precisar do painel ----
    //
    // Nao ha endpoint publico de troca de senha, e nao deve haver: seria um lugar a mais para testar
    // senha alheia. O caminho aqui usa o que ja existe e ja e protegido -- entra com a senha ATUAL
    // (o FreioDeTentativas do /auth/login trava forca bruta) e, com a sessao na mao, chama o
    // /auth/trocar-senha de sempre, que exige a senha atual de novo.
    const cardLogin = document.getElementById('form');
    const cardTroca = document.getElementById('formTroca');
    const mostrarTroca = (mostrar) => {
      cardTroca.hidden = !mostrar;
      cardLogin.hidden = mostrar;
      if (mostrar) {
        document.getElementById('tEmail').value = (document.getElementById('email').value || '').trim();
        document.getElementById('tEmail').focus();
      }
    };
    document.getElementById('trocar').addEventListener('click', (ev) => { ev.preventDefault(); mostrarTroca(true); });
    document.getElementById('tVoltar').addEventListener('click', (ev) => { ev.preventDefault(); mostrarTroca(false); });

    cardTroca.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('tBtn'), err = document.getElementById('tErr');
      const v = id => (document.getElementById(id).value || '').trim();
      const nova = document.getElementById('tNova').value, nova2 = document.getElementById('tNova2').value;
      err.style.color = ''; err.textContent = '';
      if (nova.length < 8) { err.textContent = 'A nova senha precisa ter ao menos 8 caracteres.'; return; }
      if (nova !== nova2) { err.textContent = 'As duas novas senhas não conferem.'; return; }
      btn.disabled = true; btn.textContent = 'Trocando…';
      try {
        const resp = await Bora.login(v('tEmail'), document.getElementById('tAtual').value);
        Bora.setSession(resp);
        try {
          await Bora.api('/auth/trocar-senha', { method: 'POST',
            body: JSON.stringify({ senhaAtual: document.getElementById('tAtual').value, novaSenha: nova }) });
        } catch (dentro) {
          // Entrou mas nao trocou: a sessao aberta aqui nao pode ficar de pe com a senha que a
          // pessoa justamente quer abandonar.
          localStorage.removeItem('boraToken'); localStorage.removeItem('boraUser');
          throw dentro;
        }
        location.href = 'dashboard.html';
      } catch (ex) {
        const m = ex && ex.message ? ex.message : '';
        // "Credenciais invalidas" aqui quer dizer senha ATUAL errada, e e isso que a pessoa precisa ler.
        err.textContent = /credenci/i.test(m) ? 'Senha atual incorreta.' : (m || 'Não foi possível trocar a senha.');
        btn.disabled = false; btn.textContent = 'Trocar senha';
      }
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn'), err = document.getElementById('err');
      btn.disabled = true; btn.textContent = 'Entrando...'; err.textContent = '';
      try {
        const resp = await Bora.login(document.getElementById('email').value.trim(), document.getElementById('senha').value);
        Bora.setSession(resp);
        location.href = 'dashboard.html';
      } catch (ex) {
        err.textContent = ex.message || 'Falha no login';
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
